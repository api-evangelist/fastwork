aid: fastwork
name: Fastwork
description: >-
  Fastwork is Thailand's leading freelance and services marketplace, connecting
  businesses and individuals with roughly 200,000 vetted service providers across
  about 300 categories — including design and graphics, web and app development,
  AI development and automation, marketing and advertising, writing and translation,
  photography and video, and lifestyle services. An escrow-based "Fastwork Guarantee"
  holds payment until work is delivered, protecting both buyers and freelancers. The
  platform serves individuals, SMEs, and enterprises with a dedicated business portal,
  and is expanding from Thailand into Indonesia and Vietnam. Fastwork is backed by
  500 Global and Partech. No public developer API is currently published; this profile
  captures the company's public web surface and domain-security posture.
